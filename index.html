<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bati Na Tayo Baby 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff1f6);
    overflow: hidden;
  }
  .card {
    width: min(90%, 420px);
    padding: 42px 24px;
    text-align: center;
    background: rgba(255,255,255,.9);
    border-radius: 28px;
    box-shadow: 0 15px 45px rgba(180, 70, 110, .2);
  }
  .heart { font-size: 58px; animation: beat 1.1s infinite; }
  @keyframes beat {
    50% { transform: scale(1.12); }
  }
  h1 {
    color: #d6336c;
    margin: 15px 0 10px;
    font-size: 30px;
  }
  p {
    color: #6b3b4d;
    font-size: 17px;
    line-height: 1.5;
  }
  .buttons {
    position: relative;
    height: 100px;
    margin-top: 25px;
  }
  button {
    border: 0;
    border-radius: 14px;
    padding: 13px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  #yes {
    background: #d6336c;
    color: white;
    margin-right: 12px;
  }
  #no {
    background: #eee;
    color: #555;
    position: absolute;
    transition: left .18s ease, top .18s ease;
  }
  #message {
    display: none;
    margin-top: 20px;
    color: #d6336c;
    font-weight: bold;
    font-size: 20px;
  }

  .floating-heart {
    position: fixed;
    bottom: -40px;
    font-size: 28px;
    pointer-events: none;
    animation: floatUp 3s ease-out forwards;
    z-index: 999;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.7) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.25) rotate(25deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">🙏</div>
    <h1>Bati na tayo baby please 🙏</h1>
    <p>
      Love mo na ako ulit please 🙏
    </p>

    <div class="buttons" id="area">
      <button id="yes">YES 🙏</button>
      <button id="no">NO 😤</button>
    </div>

    <div id="message">YAYYY! Love mo na ako ulit! 🙏</div>
  </div>

<script>
const no = document.getElementById("no");
const area = document.getElementById("area");
const yes = document.getElementById("yes");
const message = document.getElementById("message");

function runaway() {
  const maxX = area.clientWidth - no.offsetWidth;
  const maxY = area.clientHeight - no.offsetHeight;
  no.style.left = Math.max(0, Math.random() * maxX) + "px";
  no.style.top = Math.max(0, Math.random() * maxY) + "px";
}

no.addEventListener("mouseenter", runaway);
no.addEventListener("touchstart", (e) => {
  e.preventDefault();
  runaway();
});

yes.addEventListener("click", () => {
  message.style.display = "block";
  no.style.display = "none";
  yes.textContent = "I LOVE YOU 🙏";

  // Make hearts float across the screen.
  for (let i = 0; i < 28; i++) {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.textContent = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDelay = (Math.random() * 1.2) + "s";
    heart.style.fontSize = (18 + Math.random() * 22) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4300);
  }
});
</script>
</body>
</html>
